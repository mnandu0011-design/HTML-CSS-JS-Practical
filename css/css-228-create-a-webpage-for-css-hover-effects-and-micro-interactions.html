<body><nav class="topbar"><strong>HTML • CSS • JavaScript Practical Lab</strong><span class="navlinks"><a href="../index.html">Home</a><a href="index.html">Back to Programs</a></span></nav><main class="container"><section class="hero"><span class="tag">CSS PROGRAM 228</span><h1>Create a webpage for CSS hover effects and micro-interactions.</h1><p>CSS practical program</p></section><section class="demo"><h2>Working demonstration</h2><button class="btn" style="transition:transform .25s,box-shadow .25s" onmouseover="this.style.transform='translateY(-4px) scale(1.03)';this.style.boxShadow='0 10px 20px #0002'" onmouseout="this.style.transform='';this.style.boxShadow=''">Hover me</button></section><section class="demo"><h2>Try it</h2><p>Resize the browser or interact with the component to observe the CSS behavior.</p></section></main>
