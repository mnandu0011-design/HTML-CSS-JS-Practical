<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Create a stopwatch.</title><link rel="stylesheet" href="../assets/style.css"></head>
<body><nav class="topbar"><strong>HTML • CSS • JavaScript Practical Lab</strong><span class="navlinks"><a href="../index.html">Home</a><a href="index.html">Back to Programs</a></span></nav><main class="container"><section class="hero"><span class="tag">MINI PROGRAM 3</span><h1>Create a stopwatch.</h1><p>Runnable JavaScript practical program</p></section><section class="demo"><div id="time" style="font-size:2.5rem;text-align:center">00:00.0</div><div class="flex" style="justify-content:center"><button class="btn" onclick="start()">Start</button><button class="btn secondary" onclick="stop()">Stop</button><button class="btn danger" onclick="reset()">Reset</button></div></section><section class="demo"><h2>Study note</h2><p>Open this file in a browser, interact with the demo, and inspect the source to understand the implementation.</p></section></main>
<footer class="footer"><a href="../index.html">Home</a> · <a href="index.html">Back to Programs</a></footer><script>let st=0,timer;function render(){let x=Date.now()-st;time.textContent=`${String(Math.floor(x/60000)).padStart(2,'0')}:${String(Math.floor(x/1000)%60).padStart(2,'0')}.${Math.floor(x/100)%10}`}function start(){if(!timer){st=Date.now();timer=setInterval(render,100)}}function stop(){clearInterval(timer);timer=null}function reset(){stop();time.textContent='00:00.0'}</script></body></html>
