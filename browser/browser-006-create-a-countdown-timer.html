<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Create a countdown timer.</title><link rel="stylesheet" href="../assets/style.css"></head>
<body><nav class="topbar"><strong>HTML • CSS • JavaScript Practical Lab</strong><span class="navlinks"><a href="../index.html">Home</a><a href="index.html">Back to Programs</a></span></nav><main class="container"><section class="hero"><span class="tag">BROWSER PROGRAM 6</span><h1>Create a countdown timer.</h1><p>Runnable JavaScript practical program</p></section><section class="demo"><input id="sec" class="input" type="number" value="10"><button class="btn" onclick="start()">Start</button><div id="out" class="output">Ready</div></section><section class="demo"><h2>Study note</h2><p>Open this file in a browser, interact with the demo, and inspect the source to understand the implementation.</p></section></main>
<footer class="footer"><a href="../index.html">Home</a> · <a href="index.html">Back to Programs</a></footer><script>let tm;function start(){clearInterval(tm);let n=+sec.value;out.textContent=n;tm=setInterval(()=>{n--;out.textContent=n>0?n:'Time up!';if(n<=0)clearInterval(tm)},1000)}</script></body></html>
