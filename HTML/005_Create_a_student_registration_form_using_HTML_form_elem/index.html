<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>HTML Experiment 5</title>
  <style>
  *{box-sizing:border-box} body{font-family:Arial,sans-serif;margin:0;padding:30px;background:#f5f7fb;color:#222}
  .container{max-width:1000px;margin:auto;background:white;padding:25px;border-radius:14px;box-shadow:0 5px 20px #0001}
  button,input,select,textarea{padding:10px;margin:5px;border:1px solid #bbb;border-radius:6px}
  button{cursor:pointer} .card{padding:20px;margin:10px 0;border:1px solid #ddd;border-radius:10px}
  
  </style>
</head>
<body><div class="container">
<h1>HTML Experiment 5</h1>
<p><strong>Experiment:</strong> Create a student registration **form** using HTML form elements.</p><form onsubmit="return false">
        <label>Name <input type="text" required></label><br>
        <label>Email <input type="email" required></label><br>
        <label>Password <input type="password" required></label><br>
        <label>Date <input type="date"></label><br>
        <label>Number <input type="number" min="0"></label><br>
        <button type="submit">Submit</button></form>
</div>
<script></script>
</body></html>
