<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Create a password strength checker.</title><link rel="stylesheet" href="../assets/style.css"></head>
<body><nav class="topbar"><strong>HTML • CSS • JavaScript Practical Lab</strong><span class="navlinks"><a href="../index.html">Home</a><a href="index.html">Back to Programs</a></span></nav><main class="container"><section class="hero"><span class="tag">DOM PROGRAM 3</span><h1>Create a password strength checker.</h1><p>Runnable JavaScript practical program</p></section><section class="demo"><input id="pass" class="input" type="password" oninput="check()" placeholder="Enter password"><div id="out" class="output"></div></section><section class="demo"><h2>Study note</h2><p>Open this file in a browser, interact with the demo, and inspect the source to understand the implementation.</p></section></main>
<footer class="footer"><a href="../index.html">Home</a> · <a href="index.html">Back to Programs</a></footer><script>function check(){let p=pass.value,s=0;s+=p.length>=8;s+=/[A-Z]/.test(p);s+=/[0-9]/.test(p);s+=/[^A-Za-z0-9]/.test(p);out.textContent=['Very weak','Weak','Medium','Strong','Very strong'][s]}</script></body></html>
